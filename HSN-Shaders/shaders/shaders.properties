iris.features.optional = ENTITY_TRANSLUCENT
oldLighting = false
underwaterOverlay = false
vignette = false
separateAo = false
clouds = true
rain.depth = true
beacon.beam.depth = true
dynamicHandLight = true
supportsColorCorrection = false
shadowHardwareFiltering = false
shadow.enabled = true

#if SHADOW_QUALITY == -1
program.shadow.enabled = false
#endif


#ifndef BLOOM_ENABLED
program.composite1.enabled = false
program.composite2.enabled = false
#endif

#if !defined(CLOUDS_ENABLED) && !defined(GODRAYS_ENABLED) && !defined(SSAO_ENABLED)
program.composite3.enabled = false
#endif

texture.noise = lib/textures/noise.png
customTexture.cloudtex = lib/textures/clouds.png
customTexture.watertex = lib/textures/water.png
customTexture.bluenoise = lib/textures/bluenoise.png

# Profiles
profile.POTATO = SHADOW_QUALITY=-1 shadowMapResolution=512 shadowDistance=64.0 BLOOM_STRENGTH=0.00 VIGNETTE=0.12 CHROMA_ABERRATION=0.00 SHARPEN=0.00 VL_STRENGTH=0.00 SSAO_STRENGTH=0.00 GODRAY_STRENGTH=0.00
profile.LOW    = SHADOW_QUALITY=0  shadowMapResolution=1024 shadowDistance=96.0 BLOOM_STRENGTH=0.20 VIGNETTE=0.20 CHROMA_ABERRATION=0.00 SHARPEN=0.08 VL_STRENGTH=0.00 SSAO_STRENGTH=0.00 GODRAY_STRENGTH=0.00
profile.MEDIUM = SHADOW_QUALITY=1  shadowMapResolution=1024 shadowDistance=96.0 BLOOM_STRENGTH=0.35 VIGNETTE=0.28 CHROMA_ABERRATION=0.00 SHARPEN=0.10 VL_STRENGTH=0.00 SSAO_STRENGTH=0.00 GODRAY_STRENGTH=0.00
profile.HIGH   = SHADOW_QUALITY=1  shadowMapResolution=2048 shadowDistance=128.0 BLOOM_STRENGTH=0.45 VIGNETTE=0.30 VL_STRENGTH=0.40 VL_STEPS=6 GODRAY_STRENGTH=0.20
profile.ULTRA  = SHADOW_QUALITY=2  shadowMapResolution=2048 shadowDistance=160.0 BLOOM_STRENGTH=0.55 VIGNETTE=0.32 VL_STRENGTH=0.55 VL_STEPS=12 GODRAY_STRENGTH=0.28 SSAO_STRENGTH=0.30

screen = <empty> <empty> [INFORMATION] SHADER_STYLE <profile> <empty> <empty> <empty> [PERFORMANCE_SETTINGS] [CAMERA_SETTINGS] [LIGHTING_SETTINGS] [ATMOSPHERE_SETTINGS] [MATERIAL_SETTINGS] [OTHER_SETTINGS]
screen.columns = 2

screen.INFORMATION = <empty> <empty> info0 info1 info2 <empty> info3 info4
screen.INFORMATION.columns = 2

screen.PERFORMANCE_SETTINGS = <profile> <empty> <empty> <empty> SHADOW_QUALITY shadowMapResolution shadowDistance SHADOW_BIAS SHADOW_DISTORT_FACTOR ENTITY_SHADOW
screen.PERFORMANCE_SETTINGS.columns = 2

screen.LIGHTING_SETTINGS = <empty> <empty> SHADOW_BRIGHTNESS WARMTH <empty> <empty> [SHADOW_SETTINGS] [VL_SETTINGS]
screen.LIGHTING_SETTINGS.columns = 2
screen.SHADOW_SETTINGS = <empty> <empty> SHADOW_QUALITY SHADOW_BRIGHTNESS SHADOW_BIAS SHADOW_DISTORT_FACTOR shadowMapResolution shadowDistance SHADOW_DISTORT_ENABLED
screen.SHADOW_SETTINGS.columns = 2

screen.CAMERA_SETTINGS = <empty> <empty> [TONEMAP_SETTINGS] [BLOOM_SETTINGS] <empty> <empty> VIGNETTE CHROMA_ABERRATION SHARPEN
screen.CAMERA_SETTINGS.columns = 2
screen.TONEMAP_SETTINGS = <empty> <empty> EXPOSURE CONTRAST SATURATION WARMTH
screen.TONEMAP_SETTINGS.columns = 2
screen.BLOOM_SETTINGS = <empty> <empty> BLOOM_ENABLED BLOOM_STRENGTH GLOW_STRENGTH
screen.BLOOM_SETTINGS.columns = 2

screen.ATMOSPHERE_SETTINGS = <empty> <empty> FOG_STRENGTH FOG_DENSITY NIGHT_FOG SUN_SIZE MOON_SIZE <empty> [CLOUD_SETTINGS] [GODRAY_SETTINGS] SSAO_ENABLED SSAO_STRENGTH
screen.ATMOSPHERE_SETTINGS.columns = 2

screen.MATERIAL_SETTINGS = <empty> <empty> [WATER_SETTINGS] [WAVING_SETTINGS]
screen.MATERIAL_SETTINGS.columns = 2
screen.WATER_SETTINGS = <empty> <empty> WATER_TINT WATER_WAVES
screen.WATER_SETTINGS.columns = 2

screen.OTHER_SETTINGS = <empty> <empty> info0 info1 DITHER_ENABLED
screen.OTHER_SETTINGS.columns = 2
screen.CLOUD_SETTINGS = <empty> <empty> CLOUDS_ENABLED CLOUD_OPACITY
screen.CLOUD_SETTINGS.columns = 2
screen.GODRAY_SETTINGS = <empty> <empty> GODRAYS_ENABLED GODRAY_STRENGTH
screen.GODRAY_SETTINGS.columns = 2
screen.VL_SETTINGS = <empty> <empty> VOLUMETRIC_LIGHTING VL_STRENGTH VL_STEPS
screen.VL_SETTINGS.columns = 2
screen.WAVING_SETTINGS = <empty> <empty> WAVING_FOLIAGE WAVING_SPEED WAVING_STRENGTH
screen.WAVING_SETTINGS.columns = 2

sliders = shadowMapResolution shadowDistance SHADOW_BIAS SHADOW_DISTORT_FACTOR SHADOW_BRIGHTNESS WARMTH SATURATION CONTRAST EXPOSURE GLOW_STRENGTH BLOOM_STRENGTH VIGNETTE CHROMA_ABERRATION SHARPEN WATER_TINT FOG_STRENGTH FOG_DENSITY NIGHT_FOG SUN_SIZE MOON_SIZE CLOUD_OPACITY GODRAY_STRENGTH VL_STRENGTH VL_STEPS SSAO_STRENGTH WAVING_SPEED WAVING_STRENGTH

alphaTest.shadow = GREATER 0.1
alphaTest.gbuffers_terrain = GREATER 0.1
alphaTest.gbuffers_water = GREATER 0.1
