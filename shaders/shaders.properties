oldLighting = false
underwaterOverlay = false
vignette = false
separateAo = false
clouds = fancy
rain.depth = false
beacon.beam.depth = false
dynamicHandLight = false
supportsColorCorrection = false
shadowHardwareFiltering = false
sun = true
moon = true

shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true
shadowPlayer = true

colortex0Format = R11F_G11F_B10F
colortex1Format = R11F_G11F_B10F
colortex1Clear = true

#if SHADOW_QUALITY == -1
program.shadow.enabled = false
#endif

#if !defined POST_PROCESSING || !defined BLOOM_ENABLED
program.composite1.enabled = false
program.composite2.enabled = false
#endif

program.composite3.enabled = false
program.deferred.enabled = false

texture.noise = lib/textures/noise.png
customTexture.watertex = lib/textures/water.png

profile.POTATO = SHADOW_QUALITY=-1 shadowDistance=64.0 SHADOW_BRIGHTNESS=0.82 !POST_PROCESSING !BLOOM_ENABLED BLOOM_STRENGTH=0.00 VIGNETTE=0.00 CHROMA_ABERRATION=0.00 SHARPEN=0.00 !WAVING_FOLIAGE FOG_STRENGTH=0.75 FOG_DENSITY=0.60
profile.LOW    = SHADOW_QUALITY=0  shadowDistance=80.0 SHADOW_BRIGHTNESS=0.72 POST_PROCESSING BLOOM_ENABLED BLOOM_STRENGTH=0.10 VIGNETTE=0.14 CHROMA_ABERRATION=0.00 SHARPEN=0.00 WAVING_FOLIAGE FOG_STRENGTH=1.00 FOG_DENSITY=1.00
profile.MEDIUM = SHADOW_QUALITY=1  shadowDistance=128.0 SHADOW_BRIGHTNESS=0.64 POST_PROCESSING BLOOM_ENABLED BLOOM_STRENGTH=0.16 VIGNETTE=0.18 CHROMA_ABERRATION=0.00 SHARPEN=0.06 WAVING_FOLIAGE FOG_STRENGTH=1.20 FOG_DENSITY=1.15
profile.HIGH   = SHADOW_QUALITY=1  shadowDistance=160.0 SHADOW_BRIGHTNESS=0.64 POST_PROCESSING BLOOM_ENABLED BLOOM_STRENGTH=0.16 VIGNETTE=0.18 CHROMA_ABERRATION=0.00 SHARPEN=0.06 WAVING_FOLIAGE FOG_STRENGTH=1.20 FOG_DENSITY=1.15

screen = <profile> POST_PROCESSING [PERFORMANCE_SETTINGS] [SHADOW_SETTINGS] [POST_SETTINGS] [WATER_SETTINGS] [ATMOSPHERE_SETTINGS] [FOLIAGE_SETTINGS]
screen.columns = 2

screen.PERFORMANCE_SETTINGS = <profile> SHADOW_QUALITY shadowDistance WAVING_FOLIAGE
screen.PERFORMANCE_SETTINGS.columns = 2

screen.SHADOW_SETTINGS = SHADOW_QUALITY shadowDistance SHADOW_BRIGHTNESS SHADOW_BIAS SHADOW_DISTORT_FACTOR
screen.SHADOW_SETTINGS.columns = 2

screen.POST_SETTINGS = POST_PROCESSING BLOOM_ENABLED BLOOM_STRENGTH GLOW_STRENGTH VIGNETTE SHARPEN CHROMA_ABERRATION EXPOSURE WARMTH SATURATION CONTRAST
screen.POST_SETTINGS.columns = 2

screen.WATER_SETTINGS = WATER_TINT WATER_WAVES
screen.WATER_SETTINGS.columns = 2

screen.ATMOSPHERE_SETTINGS = FOG_STRENGTH FOG_DENSITY NIGHT_FOG
screen.ATMOSPHERE_SETTINGS.columns = 2

screen.FOLIAGE_SETTINGS = WAVING_FOLIAGE WAVING_SPEED WAVING_STRENGTH
screen.FOLIAGE_SETTINGS.columns = 2

sliders = shadowDistance SHADOW_BRIGHTNESS SHADOW_BIAS SHADOW_DISTORT_FACTOR BLOOM_STRENGTH GLOW_STRENGTH VIGNETTE EXPOSURE WARMTH SATURATION CONTRAST WATER_TINT FOG_STRENGTH FOG_DENSITY NIGHT_FOG WAVING_SPEED WAVING_STRENGTH SHARPEN CHROMA_ABERRATION

