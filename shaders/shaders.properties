oldLighting = false
underwaterOverlay = false
vignette = false
separateAo = false
clouds = fancy
rain.depth = false
beacon.beam.depth = false
dynamicHandLight = false
supportsColorCorrection = false
shadowHardwareFiltering = false
sun = true
moon = true

#if SHADOW_QUALITY == -1
program.shadow.enabled = false
#endif

#ifndef BLOOM_ENABLED
program.composite1.enabled = false
program.composite2.enabled = false
#endif

#if !defined GODRAYS_ENABLED && !defined CLOUDS_ENABLED && !defined SSAO_ENABLED && !defined VOLUMETRIC_LIGHTING
program.composite3.enabled = false
#endif

program.deferred.enabled = false

texture.noise = lib/textures/noise.png
customTexture.watertex = lib/textures/water.png
customTexture.cloudtex = lib/textures/clouds.png

profile.POTATO = SHADOW_QUALITY=-1 shadowMapResolution=512 shadowDistance=64.0 !BLOOM_ENABLED BLOOM_STRENGTH=0.00 !REFLECTIONS_ENABLED REFLECTION_STRENGTH=0.35 VIGNETTE=0.10 CHROMA_ABERRATION=0.00 SHARPEN=0.00 !WAVING_FOLIAGE !GODRAYS_ENABLED !CLOUDS_ENABLED !SSAO_ENABLED !VOLUMETRIC_LIGHTING
profile.LOW    = SHADOW_QUALITY=0  shadowMapResolution=512 shadowDistance=64.0 BLOOM_ENABLED BLOOM_STRENGTH=0.22 !REFLECTIONS_ENABLED REFLECTION_STRENGTH=0.45 VIGNETTE=0.18 CHROMA_ABERRATION=0.00 SHARPEN=0.00 WAVING_FOLIAGE !GODRAYS_ENABLED !CLOUDS_ENABLED !SSAO_ENABLED !VOLUMETRIC_LIGHTING
profile.MEDIUM = SHADOW_QUALITY=0  shadowMapResolution=1024 shadowDistance=96.0 BLOOM_ENABLED BLOOM_STRENGTH=0.30 !REFLECTIONS_ENABLED REFLECTION_STRENGTH=0.55 VIGNETTE=0.22 CHROMA_ABERRATION=0.00 SHARPEN=0.08 WAVING_FOLIAGE !GODRAYS_ENABLED !CLOUDS_ENABLED !SSAO_ENABLED !VOLUMETRIC_LIGHTING
profile.HIGH   = SHADOW_QUALITY=1  shadowMapResolution=1024 shadowDistance=96.0 BLOOM_ENABLED BLOOM_STRENGTH=0.40 REFLECTIONS_ENABLED REFLECTION_STRENGTH=0.65 VIGNETTE=0.24 CHROMA_ABERRATION=0.06 SHARPEN=0.10 WAVING_FOLIAGE GODRAYS_ENABLED !CLOUDS_ENABLED !SSAO_ENABLED !VOLUMETRIC_LIGHTING

screen = SHADER_STYLE <profile> <empty> <empty> [INFORMATION] [PERFORMANCE_SETTINGS] [LIGHTING_SETTINGS] [BLOOM_SETTINGS] [WATER_SETTINGS] [ATMOSPHERE_SETTINGS] [CAMERA_SETTINGS] [OTHER_SETTINGS]
screen.columns = 2

screen.INFORMATION = info0 info1 info2 info3
screen.INFORMATION.columns = 1

screen.PERFORMANCE_SETTINGS = <profile> SHADOW_QUALITY shadowMapResolution shadowDistance WAVING_FOLIAGE
screen.PERFORMANCE_SETTINGS.columns = 2

screen.LIGHTING_SETTINGS = [SHADOW_SETTINGS] SSAO_ENABLED SSAO_STRENGTH GODRAYS_ENABLED GODRAY_STRENGTH VOLUMETRIC_LIGHTING VL_STRENGTH
screen.LIGHTING_SETTINGS.columns = 2

screen.SHADOW_SETTINGS = SHADOW_QUALITY shadowMapResolution shadowDistance SHADOW_BRIGHTNESS SHADOW_BIAS
screen.SHADOW_SETTINGS.columns = 2

screen.BLOOM_SETTINGS = BLOOM_ENABLED BLOOM_STRENGTH GLOW_STRENGTH
screen.BLOOM_SETTINGS.columns = 2

screen.WATER_SETTINGS = WATER_TINT WATER_WAVES REFLECTIONS_ENABLED REFLECTION_STRENGTH
screen.WATER_SETTINGS.columns = 2

screen.ATMOSPHERE_SETTINGS = FOG_STRENGTH FOG_DENSITY NIGHT_FOG CLOUDS_ENABLED CLOUD_OPACITY SUN_SIZE MOON_SIZE
screen.ATMOSPHERE_SETTINGS.columns = 2

screen.CAMERA_SETTINGS = EXPOSURE WARMTH SATURATION CONTRAST VIGNETTE SHARPEN CHROMA_ABERRATION
screen.CAMERA_SETTINGS.columns = 2

screen.OTHER_SETTINGS = WAVING_FOLIAGE WAVING_SPEED WAVING_STRENGTH
screen.OTHER_SETTINGS.columns = 2

sliders = shadowMapResolution shadowDistance SHADOW_BRIGHTNESS SHADOW_BIAS BLOOM_STRENGTH GLOW_STRENGTH REFLECTION_STRENGTH VIGNETTE EXPOSURE WARMTH SATURATION CONTRAST WATER_TINT FOG_STRENGTH FOG_DENSITY NIGHT_FOG CLOUD_OPACITY GODRAY_STRENGTH SSAO_STRENGTH VL_STRENGTH SUN_SIZE MOON_SIZE WAVING_SPEED WAVING_STRENGTH SHARPEN CHROMA_ABERRATION

alphaTest.shadow = GREATER 0.1
alphaTest.gbuffers_terrain = GREATER 0.1
alphaTest.gbuffers_terrain_solid = GREATER 0.1
alphaTest.gbuffers_terrain_cutout = GREATER 0.1
alphaTest.gbuffers_terrain_translucent = GREATER 0.1
alphaTest.terrain_solid = GREATER 0.1
alphaTest.terrain_cutout = GREATER 0.1
alphaTest.terrain_translucent = GREATER 0.1
alphaTest.gbuffers_water = GREATER 0.1
